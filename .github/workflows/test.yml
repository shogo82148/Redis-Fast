name: "Test"
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test-xt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: git submodule init
        run: |
          git submodule init
          git submodule update --recursive

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: "5.44"
          install-modules-with: cpm
          install-modules-args: --with-develop --with-configure
          install-modules: |
            Minilla
            Test::CPAN::Meta
            Test::Pod
            Test::MinimumVersion::Fast

      - name: Set up Redis
        uses: shogo82148/actions-setup-redis@3e38d435ea02619c76909c929ecc501806c7145e # v1.56.0
        with:
          redis-version: "8.8"
          auto-start: false

      - name: Test
        run: |
          minil test --all

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: list
        id: set-matrix
        run: |
          import json
          import os
          perl = [
              '5.44',
              '5.42',
              '5.40',
              '5.38',
              '5.36',
              '5.34',
              '5.32',
              '5.30',
              '5.28',
              '5.26',
              '5.24',
          ]
          redis = [
              '8.8',
              '8.6',
              '8.4',
              '7.4',
              '7.2',
              '6.2',
          ]
          includes = []
          for r in redis:
              includes.append({'perl': perl[0], 'redis': r, 'os': 'macos-latest'})
          matrix = {
              'perl': perl,
              'redis': redis,
              'os': ['ubuntu-latest'],
              'include': includes
          }
          output = json.dumps(matrix, separators=(',', ':'))
          with open(os.environ["GITHUB_OUTPUT"], 'a', encoding="utf-8") as f:
              f.write('matrix={0}'.format(output))
        shell: python

  test:
    runs-on: ${{ matrix.os }}
    needs: list

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: git submodule init
        run: |
          git submodule init
          git submodule update --recursive

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpm
          install-modules-args: --with-develop --with-configure
          # xxx: we not depend URI directly, however install it explicitly.
          # because cpm sometimes installs old version of URI.
          install-modules: Minilla URI

      - name: Set up Redis ${{ matrix.redis }}
        uses: shogo82148/actions-setup-redis@3e38d435ea02619c76909c929ecc501806c7145e # v1.56.0
        with:
          redis-version: ${{ matrix.redis }}
          auto-start: false

      - name: Test
        run: |
          minil test --norelease --noauthor --noautomated
        env:
          REDIS_DEBUG: "1"
